name: "LAB-12 - 03 GKE Monitoring & Logging Dağıtımı"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "İşlem türü"
        type: choice
        required: true
        default: apply
        options: [apply, destroy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab12-gke-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring:
    runs-on: ubuntu-latest
    environment: gke-training
    env:
      GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-west1-b' }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'novashop-training-gke' }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN || 'devopsatolyesi.com' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: GCP kimlik doğrulaması (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: GKE kubeconfig oluştur
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.GCP_ZONE }}

      - name: Monitoring ve Logging bileşenlerini sil (Destroy)
        if: inputs.action == 'destroy'
        run: |
          kubectl delete -f labs/LAB-12/monitoring/ --ignore-not-found=true

      - name: Monitoring ve Logging bileşenlerini kur (Apply)
        if: inputs.action == 'apply'
        run: |
          kubectl apply -f labs/LAB-12/monitoring/00-namespaces.yaml
          kubectl apply -f labs/LAB-12/monitoring/01-elasticsearch.yaml
          kubectl apply -f labs/LAB-12/monitoring/02-kibana.yaml
          kubectl apply -f labs/LAB-12/monitoring/03-logstash.yaml
          kubectl apply -f labs/LAB-12/monitoring/04-fluent-bit.yaml
          kubectl apply -f labs/LAB-12/monitoring/05-prometheus.yaml
          kubectl apply -f labs/LAB-12/monitoring/06-grafana.yaml
          kubectl apply -f labs/LAB-12/monitoring/07-shared-ingress.yaml

      - name: Kibana Varsayılan Data View (k8s-logs-*) Oluştur
        if: inputs.action == 'apply'
        run: |
          echo "Kibana podunun hazır olması bekleniyor..."
          kubectl rollout status deployment/kibana -n logging --timeout=300s || true
          KIBANA_POD=$(kubectl get pod -n logging -l app=kibana -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$KIBANA_POD" ]; then
            echo "Kibana Data View (k8s-logs-*) tanımlanıyor..."
            kubectl exec -n logging "$KIBANA_POD" -- curl -s -X POST "http://localhost:5601/api/data_views/data_view" \
              -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
              -d'{"data_view": {"id": "k8s-logs-default", "title": "k8s-logs-*", "name": "Kubernetes Logs", "timeFieldName": "@timestamp"}}' || true
            kubectl exec -n logging "$KIBANA_POD" -- curl -s -X POST "http://localhost:5601/api/data_views/default" \
              -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
              -d'{"data_view_id": "k8s-logs-default"}' || true
          fi

      - name: Paylaşımlı load balancer IP adresini bekle
        if: inputs.action == 'apply'
        run: |
          echo "Traefik load balancer IP adresi kontrol ediliyor..."
          for i in {1..30}; do
            LB_IP=$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$LB_IP" ]; then
              echo "LB_IP=$LB_IP" >> "$GITHUB_ENV"
              echo "LB IP: $LB_IP"
              break
            fi
            echo "IP henüz atanmadı, bekleniyor ($i/30)..."
            sleep 10
          done

      - name: Cloudflare DNS Kayıtlarını Senkronize Et
        if: inputs.action == 'apply'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN veya CLOUDFLARE_ZONE_ID secret'ı tanımlanmamış. DNS güncellemesi atlandı."
            exit 0
          fi

          if [ -z "$LB_IP" ]; then
            echo "::error::Load balancer IP adresi bulunamadı."
            exit 1
          fi

          API="https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records"
          cf() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }

          DOMAINS=("novashop1" "elk1" "grafana1" "prometheus1")
          echo "Cloudflare DNS kayıtları güncelleniyor -> $LB_IP"

          for sub in "${DOMAINS[@]}"; do
            RECORD_NAME="$sub.$BASE_DOMAIN"
            echo "--- $RECORD_NAME işleniyor ---"
            EXISTING=$(cf "$API?name=$RECORD_NAME")
            echo "$EXISTING" | jq -e '.success' >/dev/null || { echo "$EXISTING" | jq '.errors'; exit 1; }

            # GKE load balancer'ı IP verir; aynı adlı CNAME (ör. EKS ALB) A kaydıyla çakışır, silinir
            for id in $(echo "$EXISTING" | jq -r '.result[] | select(.type=="CNAME") | .id'); do
              echo "Eski CNAME siliniyor: $RECORD_NAME"
              cf -X DELETE "$API/$id" | jq -e '.success' >/dev/null
            done

            BODY="{\"type\":\"A\",\"name\":\"$RECORD_NAME\",\"content\":\"$LB_IP\",\"ttl\":1,\"proxied\":true}"
            RECORD_ID=$(echo "$EXISTING" | jq -r '.result[] | select(.type=="A") | .id' | head -1)
            if [ -n "$RECORD_ID" ]; then
              echo "Mevcut A kaydı güncelleniyor: $RECORD_NAME"
              RESULT=$(cf -X PUT "$API/$RECORD_ID" --data "$BODY")
            else
              echo "Yeni A kaydı ekleniyor: $RECORD_NAME"
              RESULT=$(cf -X POST "$API" --data "$BODY")
            fi
            echo "$RESULT" | jq -e '.success' >/dev/null || { echo "$RESULT" | jq '.errors'; exit 1; }
          done
          echo "CF_DNS=true" >> "$GITHUB_ENV"

      - name: Smoke test
        if: inputs.action == 'apply'
        run: |
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors -H "Host: novashop1.$BASE_DOMAIN" "http://$LB_IP/actuator/health"; echo
          for sub in grafana1 prometheus1 elk1; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 10 --retry-delay 10 --retry-all-errors -H "Host: $sub.$BASE_DOMAIN" "http://$LB_IP/")
            echo "$sub.$BASE_DOMAIN -> HTTP $CODE"
            case "$CODE" in 200|302) ;; *) exit 1 ;; esac
          done
          if [ "${CF_DNS:-}" = true ]; then
            curl -fsS --retry 10 --retry-delay 10 --retry-all-errors "https://novashop1.$BASE_DOMAIN/actuator/health"; echo
          fi

      - name: Özet ve Erişim Linkleri
        if: inputs.action == 'apply'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## NovaShop GKE Monitoring ve Logging Dağıtımı Tamamlandı

          ### Servis Erişim Linkleri:
          - **NovaShop Uygulaması:** [https://novashop1.$BASE_DOMAIN](https://novashop1.$BASE_DOMAIN)
          - **Kibana (ELK 9):** [https://elk1.$BASE_DOMAIN](https://elk1.$BASE_DOMAIN)
          - **Grafana Paneli:** [https://grafana1.$BASE_DOMAIN](https://grafana1.$BASE_DOMAIN) (Kullanıcı: \`admin\` / Şifre: \`devops2026\`)
          - **Prometheus:** [https://prometheus1.$BASE_DOMAIN](https://prometheus1.$BASE_DOMAIN)

          ### Load Balancer IP Adresi:
          - \`http://$LB_IP\`
          EOF
