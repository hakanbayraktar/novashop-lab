name: "LAB-12 - 01 GKE Altyapısı (Terraform)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Çalıştırılacak Terraform işlemi"
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab12-gke-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && 'gke-training' || '' }}
    defaults:
      run:
        working-directory: labs/LAB-12/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west1' }}
      TF_VAR_zone: ${{ vars.GCP_ZONE || 'europe-west1-b' }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'novashop-training-gke' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-west1-b' }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: GCP kimlik doğrulaması (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: gcloud kur
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Terraform başlat
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=novashop/lab-12"
      - name: Biçim ve doğrulama
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
      - name: kubectl ve Helm kur
        if: inputs.action != 'plan'
        uses: azure/setup-helm@v5
      - name: GKE kubeconfig oluştur
        if: inputs.action == 'apply'
        run: gcloud container clusters get-credentials "$CLUSTER_NAME" --zone "$GCP_ZONE"
      # EKS'teki AWS Load Balancer Controller'ın karşılığı: tek LoadBalancer IP'si veren Traefik ingress controller
      - name: Traefik ingress controller kur
        if: inputs.action == 'apply'
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik \
            --namespace traefik --create-namespace \
            --version 42.4.1 \
            --set service.spec.type=LoadBalancer \
            --set providers.kubernetesIngress.publishedService.enabled=true \
            --wait --timeout 5m
      # Traefik'in açtığı Google Cloud load balancer Terraform dışındadır; VPC silinebilsin diye önce kaldırılır
      - name: Traefik load balancer'ını kaldır
        if: inputs.action == 'destroy'
        run: |
          if gcloud container clusters describe "$CLUSTER_NAME" --zone "$GCP_ZONE" >/dev/null 2>&1; then
            gcloud container clusters get-credentials "$CLUSTER_NAME" --zone "$GCP_ZONE"
            helm uninstall traefik --namespace traefik --wait --timeout 10m || true
            kubectl delete namespace traefik --ignore-not-found --wait=true --timeout=10m
          else
            echo "Cluster bulunamadı, bu adım atlandı."
          fi
      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve
