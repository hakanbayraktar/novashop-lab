global:
  environment: gke
  domain: ""

ui:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

catalog:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

cart:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

orders:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

checkout:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

ingress:
  enabled: true
  # Traefik ingress controller'ı 01 workflow'u kurar
  className: traefik
  annotations: {}
  hosts:
    - host: "novashop.devopsatolyesi.com"
      paths:
        - path: /
          pathType: Prefix
          service:
            name: novashop-ui
            port: 8080
