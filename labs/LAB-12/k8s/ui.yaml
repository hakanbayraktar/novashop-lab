apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: novashop
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: UI_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: RETAIL_UI_ENDPOINTS_CATALOG
              value: http://catalog.novashop.svc
            - name: JAVA_OPTS
              value: -Xms128m -Xmx384m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: novashop
spec:
  type: LoadBalancer
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 8080
